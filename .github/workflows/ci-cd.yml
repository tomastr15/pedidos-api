
# CI/CD: Pipeline completo para pedidos-api
name: CI-CD Pipeline

# CI/CD: cuándo se dispara
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# CI/CD: permisos mínimos
permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '21'

jobs:
  # CI: Compilación y tests
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compilar
        run: ./mvnw clean compile -B

      - name: Tests
        run: ./mvnw test -B

      - name: Empaquetar JAR
        run: ./mvnw package -DskipTests -B

      - name: Subir el JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ github.sha }}
          path: target/*.jar
          retention-days: 5

  # CI: Build de imagen Docker + scan + publicación
  docker-publish:
    name: Build, Scan & Publish Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadata (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build imagen Docker
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Sube reporte de seguridad a GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push imagen a GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # CD: Despliegue a staging
  deploy-staging:
    name: Deploy to Staging
    needs: docker-publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://pedidos-api-staging.example.com

    steps:
      - name: Anunciar el deploy
        run: |
          echo "Desplegando ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} a staging"
          # En producción real aquí iría kubectl, helm, ssh
          # o una llamada al API del proveedor
